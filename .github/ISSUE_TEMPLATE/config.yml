# Organization-wide issue chooser defaults. GitHub applies this file to every
# repository in wickra-lib that does not ship its own
# .github/ISSUE_TEMPLATE/config.yml — the Go module mirrors, the marketing
# sites, and any repository added later.
#
# The discussions link points at the organization tab, which mirrors the wickra
# repository. Every repository also has its own discussions board; the
# organization tab is the entry point for questions that are not about one
# project in particular.
#
# Blank issues stay enabled: the repositories that inherit this file ship no
# issue templates of their own, so disabling them would leave no way to open an
# issue at all.
blank_issues_enabled: true
contact_links:
  - name: Questions and ideas
    url: https://github.com/orgs/wickra-lib/discussions
    about: Ask usage questions and share ideas across the Wickra ecosystem.
  - name: Security report
    url: https://github.com/wickra-lib/wickra/security/advisories/new
    about: Report a vulnerability privately — do not open a public issue.
