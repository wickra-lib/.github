name: Indicator count

# The profile states the indicator catalogue in several places: the live-demo
# line, the "one core" summary, the ?v= cache-buster on the banner image, and
# the product table, whose screener, feature-store, genome and darwin rows
# describe what the backtest registry resolves rather than the whole core. The
# numbers are decided elsewhere -- wickra-core's re-export block and the
# registry wickra-backtest generates -- and the counts used to arrive by push:
# wickra's sync-about.yml cloned this repository with a personal access token
# and committed them. The token carried write access to four repositories,
# administration rights on wickra and admin:org, and existed for no other
# reason.
#
# This pulls instead. A schedule is the only trigger that can work: the numbers
# change in the OTHER repositories, so a push here is not the event that makes
# this profile wrong. scripts/sync-counts.mjs reads them at the latest
# releases -- the profile describes what is published, not what is merged --
# and sets every count it finds by the rule that applies to it; the same script
# keeps wickra-docs, webpage, the sites and the products in step.
#
# It also regenerates the banner itself rather than leaving that to banner.yml.
# That workflow fires on a push to profile/README.md, and a push made with
# GITHUB_TOKEN does not start workflows -- only the personal access token did.
# Relying on the trigger would have frozen the banner the moment the token went
# away, quietly and with everything green. Doing both here removes the
# dependency instead of re-creating it.
#
# The ?v= cache-buster matters for the same reason the banner does: GitHub proxies
# the raw image through Camo, so a regenerated banner at an unchanged URL keeps
# serving the old picture. Nothing bumped it before this.
on:
  schedule:
    - cron: "43 * * * *" # hourly at :43, clear of refresh-badges :17 and refresh-social :37
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Pull the indicator counts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # commits the counts, the cache-buster and the banner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Read the counts at the latest releases
        id: counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          counts=$(node scripts/sync-counts.mjs --repo .github --print-counts)
          echo "json=${counts}" >> "$GITHUB_OUTPUT"
          echo "counts: ${counts}"

      # Every count the profile states, each by its own rule: the live demo and
      # the banner take the published core, the registry products' rows the
      # registry. The cache-buster is one of them -- Camo caches the raw banner
      # by URL.
      - name: Apply them to the profile
        env:
          CORE: ${{ fromJSON(steps.counts.outputs.json).core }}
          REGISTRY: ${{ fromJSON(steps.counts.outputs.json).registry }}
        run: node scripts/sync-counts.mjs --repo .github --core "$CORE" --live "$CORE" --registry "$REGISTRY"

      - run: npm ci

      # gen-banner.mjs reads the canonical count out of profile/README.md (the
      # live-demo line, the first count in it), which the step above has
      # already corrected, and renders the image from it.
      - run: npm run gen:banner

      # The indicators badge reads the same count, so it moves in this commit
      # rather than on the next hourly badge refresh.
      - run: node scripts/fetch-badges.mjs --static-only

      - name: Commit if anything changed
        id: commitcheck
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain profile assets)" ]; then
            echo "counts already current and the banner matches; nothing to commit"
            echo "commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "commit=true" >> "$GITHUB_OUTPUT"

      - name: Commit (signed)
        if: steps.commitcheck.outputs.commit == 'true'
        uses: ./actions/signed-commit
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          message: "chore: sync indicator counts (core ${{ fromJSON(steps.counts.outputs.json).core }}, registry ${{ fromJSON(steps.counts.outputs.json).registry }})"
          paths: profile assets
