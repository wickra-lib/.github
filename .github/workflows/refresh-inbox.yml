name: Refresh inbox

# Twice a day, what is waiting for a person across every repository of the org:
# Dependabot pull requests whose checks have finished (with the verdict),
# issues or pull requests opened by people outside the org, and the open
# security alerts (code scanning, Dependabot, secret scanning). The lists are
# rewritten from scratch each run, so inbox/ holds only what is open now; the
# commit history is the log of what came and went. See scripts/fetch-inbox.mjs.
#
# The alert endpoints need security_events read on each repository. The
# workflow token has that here only, so INBOX_TOKEN carries a fine-grained
# token with read access to the three alert lists across the org; until it is
# set, the inbox names the repositories it could not read.
on:
  schedule:
    # Every 12 hours, 05:07 and 17:07 UTC, clear of refresh-badges :17,
    # refresh-social :37, indicator-count :43 and refresh-versions :47. A
    # daily run left the page up to a day old, and GitHub starts scheduled
    # runs hours late under load (05:13 routinely ran after 10:00).
    - cron: '7 5,17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch-inbox.mjs
      - .github/workflows/refresh-inbox.yml

permissions:
  contents: write
  security-events: read

concurrency:
  group: refresh-inbox
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't persist the token in .git/config (zizmor: artipacked); the
          # commit goes through actions/signed-commit, not a git push.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Collect the inbox
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
        run: node scripts/fetch-inbox.mjs

      - name: Commit if changed
        id: commitcheck
        run: |
          # Every run is committed, the scan timestamp and the ages
          # included. Skipping a run whose lists had not changed left the page
          # stating a scan three days old and calling a three-day-old alert
          # "today": a page that says when it looked has to be rewritten each
          # time it looks. Untracked files are checked separately because git
          # diff does not see them, which would make the first run a no-op.
          new=$(git ls-files --others --exclude-standard inbox)
          if [ -z "$new" ] && git diff --quiet -- inbox; then
            echo "inbox unchanged; nothing to commit"
            echo "commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "commit=true" >> "$GITHUB_OUTPUT"

      - name: Commit (signed)
        if: steps.commitcheck.outputs.commit == 'true'
        uses: ./actions/signed-commit
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          message: "chore: refresh inbox"
          paths: inbox
