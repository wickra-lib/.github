name: Regenerate profile banner

# Keeps profile/wickra-banner.svg (shown at the top of the org profile) and its
# raster copy profile/wickra-banner.webp in sync with the indicator count. The
# count in profile/README.md is kept by indicator-count.yml, which renders the
# banner in the same commit; this job re-renders it when the template, the
# scripts or the README change in a push, and commits it back through
# actions/signed-commit with GITHUB_TOKEN: signed, and like every GITHUB_TOKEN
# write it triggers no workflow, so there is no loop.
on:
  push:
    branches: [main]
    paths:
      - profile/README.md
      - assets/wickra-banner.svg
      - scripts/gen-banner.mjs
      - scripts/banner-svg.mjs
      - package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit goes through the API; nothing here pushes (zizmor: artipacked).
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run gen:banner

      - name: Commit the refreshed banner if it changed
        id: commitcheck
        run: |
          if git diff --quiet -- profile/wickra-banner.svg profile/wickra-banner.webp assets/wickra-banner.svg; then
            echo "Banner already up to date — nothing to commit."
            echo "commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "commit=true" >> "$GITHUB_OUTPUT"

      - name: Commit (signed)
        if: steps.commitcheck.outputs.commit == 'true'
        uses: ./actions/signed-commit
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          message: "chore: regenerate profile banner from current indicator count"
          paths: profile/wickra-banner.svg profile/wickra-banner.webp assets/wickra-banner.svg
