name: Refresh status badges

# Snapshots the repo-status badge SVGs into profile/badges/ so the org profile
# README and the main wickra README both serve them from this repo (like the
# banner) instead of hot-linking shields.io / codecov / … at page load. Runs
# hourly and commits only when a badge actually changed, plus on demand and on
# any change to the generator so a fresh setup populates immediately. See
# scripts/fetch-badges.mjs.
on:
  schedule:
    - cron: '17 * * * *' # hourly at :17
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch-badges.mjs
      - scripts/repos.mjs
      - scripts/static-badge.mjs
      - assets/logos/**
      - .github/workflows/refresh-badges.yml

permissions:
  contents: write

concurrency:
  group: refresh-badges
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't persist the token in .git/config (zizmor: artipacked); the
          # commit goes through actions/signed-commit, not a git push.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Fetch badge snapshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-badges.mjs

      - name: Commit if changed
        id: commitcheck
        run: |
          if [ -z "$(git status --porcelain profile/badges)" ]; then
            echo "badges unchanged; nothing to commit"
            echo "commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "commit=true" >> "$GITHUB_OUTPUT"

      - name: Commit (signed)
        if: steps.commitcheck.outputs.commit == 'true'
        uses: ./actions/signed-commit
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          message: "chore: refresh status badge snapshots"
          paths: profile/badges
