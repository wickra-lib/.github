name: Signed commit self-test

# Proves actions/signed-commit end to end before any bot relies on it, and
# that the wickra-lib-bot app's secrets mint a working, narrowly scoped token. Every commit is
# made on a throwaway branch that the job deletes again; the action itself
# fails a step whose commit GitHub does not report as verified.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - actions/signed-commit/**
      - .github/workflows/signed-commit-selftest.yml

permissions:
  contents: read

concurrency:
  group: signed-commit-selftest
  cancel-in-progress: false

jobs:
  github-token:
    name: GITHUB_TOKEN (changes, binary, large file, delete, tree, tag)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # throwaway branch, commits and tag on this repository
    env:
      BRANCH: selftest/gt-${{ github.run_id }}
      TAG: selftest-gt-${{ github.run_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the throwaway branch
        run: gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/${BRANCH}" -f sha="${GITHUB_SHA}" > /dev/null
      - name: Change, add a binary and an executable, delete a file
        run: |
          set -euo pipefail
          mkdir -p selftest
          date -u > selftest/text.txt
          head -c 4096 /dev/urandom > selftest/blob.bin
          # Over the action's 30 MB LARGE threshold: uploaded by git push to a
          # temporary branch instead of the blob API.
          head -c 41943040 /dev/urandom > selftest/large.bin
          printf '#!/bin/sh\necho ok\n' > selftest/run.sh && chmod +x selftest/run.sh
          git rm -q SUPPORT.md
      - name: Commit the changes (signed)
        id: changes
        uses: ./actions/signed-commit
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.BRANCH }}
          message: "selftest: changes mode"
          paths: selftest SUPPORT.md
      - name: Check the commit's contents
        env:
          SHA: ${{ steps.changes.outputs.sha }}
          CHANGED: ${{ steps.changes.outputs.changed }}
        run: |
          set -euo pipefail
          test "${CHANGED}" = true
          gh api "repos/${GITHUB_REPOSITORY}/contents/selftest/blob.bin?ref=${SHA}" -q .size | grep -qx 4096
          set -x
          tree=$(gh api "repos/${GITHUB_REPOSITORY}/git/trees/${SHA}?recursive=1")
          test "$(jq -r '.tree[] | select(.path=="selftest/large.bin") | .size' <<<"$tree")" = 41943040
          test "$(jq -r '.tree[] | select(.path=="selftest/large.bin") | .sha' <<<"$tree")" = "$(git hash-object selftest/large.bin)"
          # The upload branch is deleted right after the commit; the ref list may lag a moment.
          for i in 1 2 3 4 5 6; do
            left=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/signed-commit-upload/" -q length)
            [ "$left" = 0 ] && break; sleep 5
          done
          echo "upload branches left: ${left}"; test "$left" = 0
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/trees/${SHA}?recursive=1" -q '.tree[] | select(.path=="selftest/run.sh") | .mode')" = 100755
          ! gh api "repos/${GITHUB_REPOSITORY}/contents/SUPPORT.md?ref=${SHA}" > /dev/null 2>&1
      - name: A second run with nothing changed makes no commit
        id: again
        uses: ./actions/signed-commit
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.BRANCH }}
          message: "selftest: should not appear"
          paths: profile
      - env:
          CHANGED: ${{ steps.again.outputs.changed }}
        run: test "${CHANGED}" = false
      - name: Replace the whole tree and tag it (mirror mode)
        id: tree
        uses: ./actions/signed-commit
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.BRANCH }}
          mode: tree
          source: selftest
          message: "selftest: tree mode"
          tag: ${{ env.TAG }}
      - name: Check the tree and the tag
        env:
          SHA: ${{ steps.tree.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/trees/${SHA}" -q '[.tree[].path] | join(",")')" = "blob.bin,large.bin,run.sh,text.txt"
          # The upload branch is deleted right after the commit; the ref list may lag a moment.
          for i in 1 2 3 4 5 6; do
            left=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/signed-commit-upload/" -q length)
            [ "$left" = 0 ] && break; sleep 5
          done
          echo "upload branches left: ${left}"; test "$left" = 0
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" -q .object.sha)" = "${SHA}"
      - name: Delete the throwaway branch and tag
        if: always()
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" > /dev/null 2>&1 || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" > /dev/null 2>&1 || true

  app-token:
    name: wickra-lib-bot app token
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BRANCH: selftest/app-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Scoped to this repository and to contents only: the token can write
      # here and nowhere else, whatever the installation itself may reach.
      - name: Mint an installation token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.WICKRA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.WICKRA_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Create the throwaway branch with the app token
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/${BRANCH}" -f sha="${GITHUB_SHA}" > /dev/null
      - run: |
          mkdir -p selftest && date -u > selftest/app.txt
          # The installation token must carry a large file too (git push path).
          head -c 33554432 /dev/urandom > selftest/large.bin
      - name: Commit as the app (signed)
        id: commit
        uses: ./actions/signed-commit
        with:
          token: ${{ steps.app.outputs.token }}
          branch: ${{ env.BRANCH }}
          message: "selftest: app token"
          paths: selftest
      - name: The author is the app
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          author=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}" -q .author.login)
          echo "author: ${author}"
          test "${author}" = "wickra-lib-bot[bot]"
          size=$(gh api "repos/${GITHUB_REPOSITORY}/git/trees/${SHA}?recursive=1" -q '.tree[] | select(.path=="selftest/large.bin") | .size')
          test "${size}" = 33554432
          # The upload branch is deleted right after the commit; the ref list may lag a moment.
          for i in 1 2 3 4 5 6; do
            left=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/signed-commit-upload/" -q length)
            [ "$left" = 0 ] && break; sleep 5
          done
          echo "upload branches left: ${left}"; test "$left" = 0
      - name: Delete the throwaway branch
        if: always()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" > /dev/null 2>&1 || true
