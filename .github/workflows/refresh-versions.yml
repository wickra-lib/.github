name: Refresh version snapshot

# Records, for every product repo, what version each of its manifests declares
# and what each registry actually serves, so a partial release -- one publish
# job that failed while the rest went through -- is visible in one table instead
# of across six registry pages. Runs hourly and commits only when something
# actually moved, so the file's git history doubles as the log of when a version
# changed. Scans every product repository in the org; see scripts/fetch-versions.mjs.
#
# The same run then lines the repositories up against each other
# (scripts/fetch-drift.mjs -> versions/drift.md): family pins behind their
# owner, git sources for published crates, stale committed locks, unpinned pip
# installs, uv checksums, CI matrices and toolchain floors that differ, and
# Dependabot directories one repository covers and another does not -- what no
# repository can see from inside.
on:
  schedule:
    - cron: '47 * * * *' # hourly at :47 (offset from refresh-badges :17, refresh-social :37)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch-versions.mjs
      - scripts/fetch-drift.mjs
      - scripts/repos.mjs
      - .github/workflows/refresh-versions.yml

permissions:
  contents: write

concurrency:
  group: refresh-versions
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't persist the token in .git/config (zizmor: artipacked); the
          # commit goes through actions/signed-commit, not a git push.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Collect versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-versions.mjs

      - name: Line the repositories up against each other
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-drift.mjs

      - name: Commit if changed
        id: commitcheck
        run: |
          # The timestamp moves on every run, so it alone is not worth a commit;
          # only a differing table or snapshot body is. Untracked files are
          # checked separately because git diff does not see them at all, which
          # would make the very first run look like a no-op.
          new=$(git ls-files --others --exclude-standard versions)
          if [ -z "$new" ] && git diff --quiet -I '"scanned_at"' -I '^State last changed:' -I '^Last scan:' -- versions; then
            echo "versions unchanged apart from the scan timestamp; nothing to commit"
            echo "commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "commit=true" >> "$GITHUB_OUTPUT"

      - name: Commit (signed)
        if: steps.commitcheck.outputs.commit == 'true'
        uses: ./actions/signed-commit
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          message: "chore: refresh version snapshot"
          paths: versions
